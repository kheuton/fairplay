<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FairPlay — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="wire.css" />
<style>
  html, body { margin: 0; height: 100%; background: #cfc9ba; }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="parts.jsx"></script>
<script type="text/babel" src="main-screens.jsx"></script>
<script type="text/babel" src="card-screens.jsx"></script>

<script type="text/babel">
const { createRoot } = ReactDOM;
const W = 1320, H = 880;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="main" title="Main Page · Triage Inbox" subtitle="“What needs attention now” — 5 layout approaches">
        <DCArtboard id="m1" label="V1 · Three-column + peek" width={W} height={H}><MainV1/></DCArtboard>
        <DCArtboard id="m2" label="V2 · Urgency stack" width={W} height={H}><MainV2/></DCArtboard>
        <DCArtboard id="m3" label="V3 · Triage board" width={W} height={H}><MainV3/></DCArtboard>
        <DCArtboard id="m4" label="V4 · Focus queue" width={W} height={H}><MainV4/></DCArtboard>
        <DCArtboard id="m5" label="V5 · Command HUD" width={W} height={H}><MainV5/></DCArtboard>
      </DCSection>
      <DCSection id="card" title="Card Page · Default (Auto)" subtitle="A single card’s task list — 5 layout approaches, each seeding the bespoke custom view">
        <DCArtboard id="c1" label="V1 · Header band + list" width={W} height={H}><CardV1/></DCArtboard>
        <DCArtboard id="c2" label="V2 · Split schematic" width={W} height={H}><CardV2/></DCArtboard>
        <DCArtboard id="c3" label="V3 · Tabbed" width={W} height={H}><CardV3/></DCArtboard>
        <DCArtboard id="c4" label="V4 · Timeline" width={W} height={H}><CardV4/></DCArtboard>
        <DCArtboard id="c5" label="V5 · Sectioned status" width={W} height={H}><CardV5/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
